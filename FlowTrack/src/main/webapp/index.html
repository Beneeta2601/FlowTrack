<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowTrack</title>
<style>
:root {
  --bg: #fbf7f5;
  --surface: #ffffff;
  --card-bg: #f8f4f2;
  --text: #2d2d2d;
  --text-muted: #888;
  --text-light: #999;
  --border: #e5e0dd;
  --accent: #d4a8a0;
  --accent-deep: #c4958c;
  --shadow: rgba(0,0,0,0.06);
  --pill-bg: #f0ebe8;
  --pill-text: #666;
  --input-bg: #faf8f7;
  --divider: #f0ebe8;
  --sidebar-bg: #ffffff;
  --body-bg: linear-gradient(135deg, #fbf7f5 0%, #f5ece8 100%);
}

body[data-theme="dark"] {
  --bg: #1a1614;
  --surface: #24201e;
  --card-bg: #2d2825;
  --text: #f0ebe8;
  --text-muted: #b0a8a2;
  --text-light: #8a8078;
  --border: #3d3835;
  --accent: #c4958c;
  --accent-deep: #d4a8a0;
  --shadow: rgba(0,0,0,0.3);
  --pill-bg: #3d3835;
  --pill-text: #b0a8a2;
  --input-bg: #2d2825;
  --divider: #3d3835;
  --sidebar-bg: #24201e;
  --body-bg: linear-gradient(135deg, #1a1614 0%, #221d1b 100%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--body-bg);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
  -webkit-font-smoothing: antialiased;
}

#root {
  width: 100%;
  min-height: 100vh;
  padding: 16px;
}

.app-root {
  display: grid;
  gap: 16px;
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
}

.main-column {
  background: var(--surface);
  border-radius: 24px;
  box-shadow: 0 4px 20px var(--shadow);
  padding: 20px 18px 30px;
  min-width: 0;
  transition: background 0.3s;
}

.sidebar {
  display: none;
}

.mobile-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.mobile-header h1 {
  font-size: 22px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.mobile-header .mobile-user {
  background: var(--pill-bg);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  color: var(--pill-text);
  cursor: pointer;
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mobile-nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding-bottom: 12px;
  margin-bottom: 4px;
  scrollbar-width: none;
}
.mobile-nav::-webkit-scrollbar { display: none; }
.mobile-nav button {
  padding: 8px 16px;
  border: none;
  background: transparent;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-light);
  cursor: pointer;
  border-radius: 20px;
  white-space: nowrap;
  transition: all 0.15s;
  font-family: inherit;
}
.mobile-nav button.active {
  background: #f5e0d8;
  color: #4a3a3a;
  font-weight: 600;
}
body[data-theme="dark"] .mobile-nav button.active {
  background: #4a3a3a;
  color: #f5e0d8;
}

@media (min-width: 900px) {
  #root {
    padding: 32px 24px;
  }

  .app-root {
    grid-template-columns: 240px 1fr;
    gap: 28px;
    align-items: start;
  }

  .main-column {
    padding: 32px 36px 40px;
    min-height: calc(100vh - 64px);
  }

  .mobile-header,
  .mobile-nav {
    display: none;
  }

  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 24px;
    background: var(--sidebar-bg);
    border-radius: 24px;
    box-shadow: 0 4px 20px var(--shadow);
    padding: 26px 20px;
    position: sticky;
    top: 32px;
    transition: background 0.3s;
  }

  .sidebar-logo h1 {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.2;
  }
  .sidebar-logo p {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 4px;
    line-height: 1.4;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-nav button {
    padding: 12px 16px;
    border: none;
    background: transparent;
    text-align: left;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 12px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .sidebar-nav button:hover {
    background: var(--card-bg);
    color: var(--text);
  }
  .sidebar-nav button.active {
    background: #f5e0d8;
    color: #4a3a3a;
    font-weight: 600;
  }
  body[data-theme="dark"] .sidebar-nav button.active {
    background: #4a3a3a;
    color: #f5e0d8;
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--divider);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-footer .user-name {
    font-size: 12px;
    color: var(--text-light);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 4px;
  }
  .sidebar-footer .logout-btn {
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .sidebar-footer .logout-btn:hover {
    background: var(--card-bg);
  }
}

@media (min-width: 1200px) {
  .app-root {
    max-width: 1280px;
    grid-template-columns: 260px 1fr;
    gap: 36px;
  }
  .main-column {
    padding: 40px 48px 48px;
  }
}

h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.sub { color: var(--text-muted); font-size: 14px; margin-bottom: 16px; }
.card { background: var(--card-bg); border-radius: 14px; padding: 16px;
  margin-bottom: 12px; border-left: 4px solid var(--accent); }
.card .value { font-size: 18px; font-weight: 600; margin: 4px 0; }
.btn { padding: 10px 20px; border: none; border-radius: 24px; background: var(--accent);
  color: white; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn-block { width: 100%; }
.input-group { margin-bottom: 14px; }
.input-group label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 4px; }
.input-group input, .input-group select { width: 100%; padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px;
  background: var(--input-bg); color: var(--text); font-family: inherit; }
.radio-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.radio-group label { display: flex; align-items: center; gap: 4px; font-size: 14px;
  background: var(--card-bg); padding: 6px 14px; border-radius: 20px; cursor: pointer;
  border: 1.5px solid transparent; }
.radio-group label.selected { background: #f5e0d8; border-color: var(--accent); }
body[data-theme="dark"] .radio-group label.selected { background: #4a3a3a; color: #f5e0d8; }
.calendar-nav { display: flex; justify-content: space-between; align-items: center;
  margin: 12px 0; }
.calendar-nav button { background: none; border: none; font-size: 22px;
  cursor: pointer; padding: 0 12px; color: var(--text); }
.calendar-nav .month-label { font-weight: 600; font-size: 16px; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calendar-grid .day-label { font-size: 11px; font-weight: 600; color: var(--text-light);
  text-align: center; padding: 4px 0; }
.calendar-grid .day-cell { aspect-ratio: 1/1; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  font-weight: 500; background: var(--card-bg); cursor: pointer;
  color: var(--text); border: 1.5px solid transparent; }
.calendar-grid .day-cell.other { color: var(--text-light); background: transparent; cursor: default; }
.calendar-grid .day-cell.actual-start { background: #b73b3b; color: white; font-weight: 700; }
.calendar-grid .day-cell.actual { background: #f5a0a0; color: #5a1a1a; font-weight: 500; }
.calendar-grid .day-cell.predicted-start {
  background: #f5c4c4; color: #8a2a2a; font-weight: 700;
  border: 2px dashed #b73b3b; }
.calendar-grid .day-cell.predicted {
  background: #fce0e0; color: #8a2a2a;
  border: 1.5px dashed #e09595; }
.calendar-grid .day-cell.follicular { background: #d9f0d9; color: #2e6e2e; }
.calendar-grid .day-cell.ovulation { background: #7ec8c8; color: #144a4a; font-weight: 600; }
.calendar-grid .day-cell.luteal { background: #ecdcf0; color: #5a3a6a; }
.calendar-grid .day-cell.today { box-shadow: 0 0 0 3px var(--accent); }

@media (min-width: 900px) {
  .calendar-grid {
    max-width: 520px;
    margin: 0 auto;
  }
  .calendar-nav {
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }
  .legend {
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }
}

.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center;
  font-size: 11px; color: var(--text-muted); margin-top: 12px; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .swatch { width: 14px; height: 14px; border-radius: 4px; }
.legend .swatch.actual { background: #f5a0a0; }
.legend .swatch.actual-start { background: #b73b3b; }
.legend .swatch.predicted { background: #fce0e0; border: 1.5px dashed #b73b3b; }
.legend .swatch.follicular { background: #d9f0d9; }
.legend .swatch.ovulation { background: #7ec8c8; }
.legend .swatch.luteal { background: #ecdcf0; }

.phase-panel { border-radius: 16px; padding: 18px; margin-top: 16px;
  border: 1.5px solid transparent; line-height: 1.55; }
.phase-panel.menstrual { background: #fdeaea; border-color: #f5a0a0; }
.phase-panel.follicular { background: #eaf7ea; border-color: #b9e0b9; }
.phase-panel.ovulation { background: #e6f5f5; border-color: #7ec8c8; }
.phase-panel.luteal { background: #f4ecf8; border-color: #d4bce0; }
.phase-panel.unknown { background: var(--card-bg); border-color: var(--border); }
body[data-theme="dark"] .phase-panel.menstrual { background: #3a2222; border-color: #6a3232; }
body[data-theme="dark"] .phase-panel.follicular { background: #223a22; border-color: #326a32; }
body[data-theme="dark"] .phase-panel.ovulation { background: #1f3535; border-color: #2e5f5f; }
body[data-theme="dark"] .phase-panel.luteal { background: #2e223a; border-color: #4e3266; }
.phase-panel .pp-header { display: flex; align-items: center;
  justify-content: space-between; margin-bottom: 10px; }
.phase-panel .pp-phase { font-size: 17px; font-weight: 700; }
.phase-panel.menstrual .pp-phase { color: #7a2626; }
.phase-panel.follicular .pp-phase { color: #2e6e2e; }
.phase-panel.ovulation .pp-phase { color: #144a4a; }
.phase-panel.luteal .pp-phase { color: #5a3a6a; }
body[data-theme="dark"] .phase-panel.menstrual .pp-phase { color: #f5a0a0; }
body[data-theme="dark"] .phase-panel.follicular .pp-phase { color: #b9e0b9; }
body[data-theme="dark"] .phase-panel.ovulation .pp-phase { color: #7ec8c8; }
body[data-theme="dark"] .phase-panel.luteal .pp-phase { color: #d4bce0; }
.phase-panel .pp-day { font-size: 12px; background: rgba(255,255,255,0.7);
  padding: 3px 10px; border-radius: 20px; color: #666; font-weight: 500; }
body[data-theme="dark"] .phase-panel .pp-day { background: rgba(0,0,0,0.3); color: #ddd; }
.phase-panel .pp-section { margin-top: 12px; font-size: 13px; }
.phase-panel .pp-section-title { font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted);
  margin-bottom: 6px; }
.phase-panel ul { list-style: none; padding: 0; margin: 0; }
.phase-panel li { padding: 5px 0 5px 20px; position: relative;
  color: var(--text); font-size: 13px; }
.phase-panel li::before { content: '•'; position: absolute; left: 6px;
  color: var(--text-light); font-weight: bold; }
.phase-panel .pp-note { margin-top: 12px; font-size: 11px; color: var(--text-light);
  font-style: italic; line-height: 1.4; }
.phase-panel .pp-body { font-size: 13px; color: var(--text); margin-top: 8px; }

.login-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.login-tabs button { flex: 1; padding: 10px; border: none; background: var(--card-bg);
  border-radius: 10px; font-size: 14px; font-weight: 500;
  color: var(--text-muted); cursor: pointer; font-family: inherit; }
.login-tabs button.active { background: #f5e0d8; color: #4a3a3a; font-weight: 600; }
body[data-theme="dark"] .login-tabs button.active { background: #4a3a3a; color: #f5e0d8; }
.auth-header { text-align: center; margin: 20px 0 24px; }
.auth-header h1 { font-size: 28px; font-weight: 600; }
.auth-header h1 span { font-weight: 300; color: #b0a0a0; }
.auth-header p { color: var(--text-light); font-size: 14px; margin-top: 6px; }
.error-box { background: #fff0f0; color: #a00; padding: 14px; border-radius: 10px;
  font-size: 13px; margin-bottom: 12px; border: 1px solid #ffcdd2;
  font-family: monospace; word-break: break-all; }

@media (min-width: 900px) {
  .auth-shell {
    max-width: 460px;
    margin: 40px auto;
    background: var(--surface);
    border-radius: 24px;
    box-shadow: 0 4px 20px var(--shadow);
    padding: 32px 32px 40px;
  }
}

.emotion-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.emotion-picker button { padding: 10px 18px; border-radius: 24px;
  border: 1.5px solid var(--border); background: var(--surface);
  color: var(--text); font-size: 14px; cursor: pointer; transition: all 0.15s;
  font-family: inherit; }
.emotion-picker button:hover { background: var(--card-bg); }
.emotion-picker button.selected { background: var(--accent); border-color: var(--accent);
  color: white; font-weight: 600; }
.emotion-history { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 12px; }
.emotion-history .e-day { aspect-ratio: 1/1; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 20px;
  background: var(--card-bg); position: relative; cursor: pointer;
  border: 2px solid transparent; transition: all 0.15s; }
.emotion-history .e-day:hover { border-color: var(--accent); }
.emotion-history .e-day.has-emotion { background: #f5e0d8; }
body[data-theme="dark"] .emotion-history .e-day.has-emotion { background: #4a3a3a; }
.emotion-history .e-day.selected { border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(212, 168, 160, 0.3); }
.emotion-history .e-day .e-num { position: absolute; top: 2px; right: 4px;
  font-size: 9px; color: var(--text-light); font-weight: 600; }
.emotion-history .e-day.today { box-shadow: 0 0 0 2px var(--accent); }

@media (min-width: 900px) {
  .emotion-picker,
  .emotion-history {
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }
}

.period-row { display: flex; justify-content: space-between;
  align-items: center; padding: 8px 12px; background: var(--card-bg);
  border-radius: 10px; margin-bottom: 6px; font-size: 14px; }
.period-row button { background: none; border: none; color: #cc8888;
  cursor: pointer; font-size: 16px; }

.editing-banner { background: #fff3cd; border: 1px solid #ffd966;
  border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #7a5a00;
  margin-bottom: 8px; display: flex; justify-content: space-between;
  align-items: center; }
body[data-theme="dark"] .editing-banner { background: #3d3418; border-color: #6a5a2a;
  color: #e0c878; }
.editing-banner button { background: none; border: none; color: #7a5a00;
  cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: underline;
  font-family: inherit; }
body[data-theme="dark"] .editing-banner button { color: #e0c878; }

.mood-insights { background: var(--card-bg); border-radius: 14px; padding: 16px;
  margin-top: 16px; border-left: 4px solid var(--accent); }
.mood-insights h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px; }

.pattern-header { display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 14px; }
.pattern-icon { font-size: 16px; }
.pattern-sentence { font-size: 14px; color: var(--text); line-height: 1.55;
  padding: 12px 14px; background: var(--surface); border-radius: 10px;
  margin-bottom: 16px; }

/* ═══ EMOTION BAR CHART ═══ */
.emotion-chart {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.emotion-bar-row {
  display: grid;
  grid-template-columns: 120px 1fr 40px;
  align-items: center;
  gap: 10px;
}

.emotion-bar-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.emotion-bar-emoji { font-size: 16px; flex-shrink: 0; }

.emotion-bar-track {
  background: var(--surface);
  border-radius: 10px;
  height: 22px;
  overflow: hidden;
  position: relative;
}

.emotion-bar-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 0.5s ease;
  min-width: 6px;
}

.emotion-bar-count {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  text-align: right;
}

/* Emotion bar colours — light theme */
.emotion-bar-fill.bar-happy     { background: linear-gradient(90deg, #f5d76e, #e0c040); }
.emotion-bar-fill.bar-calm      { background: linear-gradient(90deg, #9ad89a, #6eb86e); }
.emotion-bar-fill.bar-tender    { background: linear-gradient(90deg, #f5b8ce, #e88cb0); }
.emotion-bar-fill.bar-moody     { background: linear-gradient(90deg, #9aaac8, #6a7ba0); }
.emotion-bar-fill.bar-irritable { background: linear-gradient(90deg, #f0a878, #d97a4a); }
.emotion-bar-fill.bar-anxious   { background: linear-gradient(90deg, #c8a8e8, #9a7ac8); }
.emotion-bar-fill.bar-sad       { background: linear-gradient(90deg, #8aa8e8, #5a7ac8); }
.emotion-bar-fill.bar-tired     { background: linear-gradient(90deg, #b8b8b8, #888888); }

/* Dark theme — slightly deeper tones */
body[data-theme="dark"] .emotion-bar-fill.bar-happy     { background: linear-gradient(90deg, #e0c878, #b89f3a); }
body[data-theme="dark"] .emotion-bar-fill.bar-calm      { background: linear-gradient(90deg, #b9e0b9, #6eaa6e); }
body[data-theme="dark"] .emotion-bar-fill.bar-tender    { background: linear-gradient(90deg, #e8b8c8, #c478a0); }
body[data-theme="dark"] .emotion-bar-fill.bar-moody     { background: linear-gradient(90deg, #b8c8e0, #7088b0); }
body[data-theme="dark"] .emotion-bar-fill.bar-irritable { background: linear-gradient(90deg, #e8c8a8, #c08858); }
body[data-theme="dark"] .emotion-bar-fill.bar-anxious   { background: linear-gradient(90deg, #d4bce0, #a088c8); }
body[data-theme="dark"] .emotion-bar-fill.bar-sad       { background: linear-gradient(90deg, #b8c8e8, #7088c8); }
body[data-theme="dark"] .emotion-bar-fill.bar-tired     { background: linear-gradient(90deg, #cccccc, #909090); }

@media (min-width: 900px) {
  .emotion-chart {
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }
}

.dash-banner { border-radius: 18px; padding: 18px; margin-bottom: 16px;
  border: 1.5px solid transparent; background: var(--card-bg); }
.dash-banner.menstrual { background: #fdeaea; border-color: #f5a0a0; }
.dash-banner.follicular { background: #eaf7ea; border-color: #b9e0b9; }
.dash-banner.ovulation { background: #e6f5f5; border-color: #7ec8c8; }
.dash-banner.luteal { background: #f4ecf8; border-color: #d4bce0; }
body[data-theme="dark"] .dash-banner.menstrual { background: #3a2222; border-color: #6a3232; }
body[data-theme="dark"] .dash-banner.follicular { background: #223a22; border-color: #326a32; }
body[data-theme="dark"] .dash-banner.ovulation { background: #1f3535; border-color: #2e5f5f; }
body[data-theme="dark"] .dash-banner.luteal { background: #2e223a; border-color: #4e3266; }
.dash-banner-row { display: flex; justify-content: space-between;
  align-items: flex-start; gap: 12px; }
.dash-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
